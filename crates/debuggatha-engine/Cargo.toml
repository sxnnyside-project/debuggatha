[package]
name = "debuggatha-engine"
description = "Debuggatha engine: a senior code reviewer that cites a real source for every finding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
debuggatha-core.workspace = true
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_ast_visit = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_semantic = "=0.158.0"
oxc_span = "=0.158.0"
regress = "0.12"
serde.workspace = true
serde_json.workspace = true
streaming-iterator = "0.1.9"
# Plain HTTP only, no TLS: the semantic layer talks to a model on this machine.
ureq = { version = "3", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.2"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-gdscript = "6.1.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"

[dev-dependencies]
flate2 = "1"
jsonschema = { version = "0.63.1", default-features = false }
