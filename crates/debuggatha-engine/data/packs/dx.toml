id = "debuggatha/dx"
version = "1.1.0"
kind = "concern"
displayName = "Developer Experience"
dependsOn = []

[[rules]]
id = "enforce-readme"
packId = "debuggatha/dx"
statement = "Every repository must have a `README.md` at the root containing local setup instructions, architecture overview, and test commands."
category = "style"
defaultSeverity = "high"
knowledgeRefs = ["know-dx-readme"]
appliesTo = { kind = "always" }

[[rules]]
id = "consistent-formatting"
packId = "debuggatha/dx"
statement = "A formatter (like Prettier, Biome, or rustfmt) must be configured and enforced via CI or pre-commit hooks to eliminate style debates."
category = "style"
defaultSeverity = "medium"
knowledgeRefs = ["know-dx-formatting"]
appliesTo = { kind = "always" }

[[rules]]
id = "meaningful-errors"
packId = "debuggatha/dx"
statement = "Error messages thrown in the codebase must contain actionable information. Avoid generic errors like `Something went wrong`."
category = "architecture"
defaultSeverity = "low"
knowledgeRefs = ["know-dx-errors"]
appliesTo = { kind = "always" }

[[rules]]
id = "document-env-vars"
packId = "debuggatha/dx"
statement = "Every environment variable the code reads must be documented in the repository (an `.env.example`, the README, a compose file, a Dockerfile or a CI workflow), so a new engineer can configure the project without reading the source."
category = "style"
defaultSeverity = "medium"
knowledgeRefs = ["know-dx-env-vars"]
appliesTo = { kind = "always" }

[[knowledge]]
id = "know-dx-readme"
title = "The README Contract"
body = "The README is the entry point for every new engineer. Failing to document how to boot the local environment costs hours of lost productivity and builds tribal knowledge."
externalRefs = ["https://www.makeareadme.com/"]
limitations = ["A monorepo where per-package READMEs cover setup/architecture/tests, with the root README deliberately kept as a short index linking to them, satisfies the underlying intent even though the root file itself lacks those sections verbatim — a rule that requires all three sections in the root file specifically will false-positive on this valid structure."]

[[knowledge]]
id = "know-dx-formatting"
title = "Automated Formatting"
body = "Debating tabs vs spaces or trailing commas in code reviews is a waste of engineering time. A strictly enforced auto-formatter standardizes the codebase and allows reviewers to focus purely on logic."
externalRefs = ["https://prettier.io/docs/en/why-prettier"]
limitations = ["A formatter config present but not actually wired into CI or a pre-commit hook (e.g. a stray `.prettierrc` left from an abandoned migration, or a formatter only run manually by convention) doesn't provide the enforcement this rule requires — detecting a config file's presence alone, without confirming it runs as a gate, produces a false negative for teams that silently stopped enforcing it."]

[[knowledge]]
id = "know-dx-errors"
title = "Actionable Error Messages"
body = "When an engineer sees an error, they should immediately know what failed, why it failed, and what to do next. Generic error strings force the engineer to use a debugger to trace the failure origin."
externalRefs = ["https://www.joelonsoftware.com/2003/10/13/wrong/"]
limitations = ["An intentionally generic top-level catch-all message shown to end users (to avoid leaking internal detail per OWASP A05) paired with a detailed error logged server-side for engineers is the correct security-conscious pattern, not a violation — a rule that inspects only the string shown at the outermost boundary, without checking whether a detailed version is captured elsewhere, will false-positive on this."]

[[knowledge]]
id = "know-dx-env-vars"
title = "Documented Configuration"
body = "Configuration read from the environment is part of a project's interface. A variable that exists only in the source makes a deployment fail at runtime, and the person who finds out is the one on call. Listing every variable with a placeholder in an example file makes the contract reviewable."
externalRefs = ["https://12factor.net/config"]
limitations = ["A variable the platform provides (`PATH`, `HOME`, `CI`, `PORT` on a PaaS) or a framework reads on its own needs no entry; a rule that flags every read of the environment will report them. A variable documented only in a wiki or a deployment repository the review cannot see is documented too, but not where this rule looks."]
