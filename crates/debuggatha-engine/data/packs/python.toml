id = "debuggatha/python"
version = "1.0.0"
kind = "stack"
displayName = "Python"
dependsOn = []

[[rules]]
id = "no-eval"
packId = "debuggatha/python"
statement = "Never evaluate a string as code; parse the data or look the operation up in a fixed table."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-eval"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-shell-interpolation"
packId = "debuggatha/python"
statement = "Do not build a shell command from interpolated or concatenated text; pass the arguments separately."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-no-shell-interpolation"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-unsafe-deserialization"
packId = "debuggatha/python"
statement = "Do not deserialize data that can come from outside with a format that rebuilds arbitrary objects."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-unsafe-deserialization"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-weak-hash"
packId = "debuggatha/python"
statement = "Do not use MD5, SHA-1 or DES for anything a person could attack; use SHA-256 or stronger."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-weak-hash"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-print-stack-trace"
packId = "debuggatha/python"
statement = "Log exceptions with the project logger instead of printing their stack trace."
category = "style"
defaultSeverity = "low"
knowledgeRefs = ["know-no-print-stack-trace"]
appliesTo = { kind = "requires-language", language = "python" }

[[knowledge]]
id = "know-no-eval"
title = "Evaluating text as code"
body = "A function that runs a string as code lets whoever controls the string run anything the program can. Replace it with data parsing or a lookup of known operations."
externalRefs = ["https://cwe.mitre.org/data/definitions/95.html"]
limitations = ["A call to a project function that happens to be named like the builtin is reported, and a string built only from constants is reported too."]

[[knowledge]]
id = "know-no-shell-interpolation"
title = "Shell command built from text"
body = "A command line assembled by interpolation or concatenation is read by a shell, so a value with a quote or a separator becomes a second command. Pass the program and its arguments as separate values."
externalRefs = ["https://cwe.mitre.org/data/definitions/78.html"]
limitations = ["Only a command built in the same file and reached by name is seen; a command assembled in another function or module is not, and a variable that only ever holds constants is reported."]

[[knowledge]]
id = "know-no-unsafe-deserialization"
title = "Deserializing untrusted bytes"
body = "Formats that rebuild arbitrary objects can run code while loading. Read data-only formats such as JSON, or restrict the classes that may be rebuilt."
externalRefs = ["https://cwe.mitre.org/data/definitions/502.html", "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"]
limitations = ["The rule cannot tell whether the bytes come from a trusted place, so data the program wrote itself is reported too.", "A call with a second argument (for example a class allowlist) is left alone; whether that argument is enough is not checked."]

[[knowledge]]
id = "know-no-weak-hash"
title = "Broken hash or cipher"
body = "MD5, SHA-1 and DES have practical collision or brute-force attacks. Use SHA-256 or stronger, and a password hash for passwords."
externalRefs = ["https://cwe.mitre.org/data/definitions/327.html"]
limitations = ["The use of the hash is not visible: checksums and cache keys are reported with low confidence.", "A digest chosen by name at run time, such as getInstance(\"MD5\"), is not read."]

[[knowledge]]
id = "know-no-print-stack-trace"
title = "Stack trace printed to the console"
body = "A trace printed to the console skips the logger, so it carries no level or context and can reach a user. Pass the exception to the logger."
externalRefs = ["https://cwe.mitre.org/data/definitions/209.html", "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"]
limitations = ["A command-line tool that prints its error for the person running it is reported although that is its job."]

[[rules]]
id = "no-assert-in-production"
packId = "debuggatha/python"
statement = "Do not use `assert` for checks that must hold in production; raise an exception."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-assert-in-production"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-bare-except"
packId = "debuggatha/python"
statement = "Do not write a bare `except:`; name the exceptions."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-bare-except"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-mutable-default-argument"
packId = "debuggatha/python"
statement = "Do not use a list, dict or set as a default argument value; default to `None` and create it inside."
category = "architecture"
defaultSeverity = "high"
knowledgeRefs = ["know-no-mutable-default-argument"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-wildcard-import"
packId = "debuggatha/python"
statement = "Do not use `from module import *`; import the names you use."
category = "style"
defaultSeverity = "low"
knowledgeRefs = ["know-no-wildcard-import"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-flask-debug"
packId = "debuggatha/python"
statement = "Do not call `app.run(debug=True)` outside development; read the setting from configuration."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-flask-debug"]
appliesTo = { kind = "requires-language", language = "python" }

[[rules]]
id = "no-http-without-timeout"
packId = "debuggatha/python"
statement = "Pass `timeout=` to every `requests` call."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-http-without-timeout"]
appliesTo = { kind = "requires-language", language = "python" }

[[knowledge]]
id = "know-no-assert-in-production"
title = "Assert is removed by -O"
body = "`python -O` strips `assert` statements, so a check written as one disappears in an optimized run."
externalRefs = ["https://docs.python.org/3/reference/simple_stmts.html#the-assert-statement", "https://bandit.readthedocs.io/en/latest/plugins/b101_assert_used.html"]
limitations = ["An `assert` that states an invariant for the reader is reported too."]

[[knowledge]]
id = "know-no-bare-except"
title = "Bare except"
body = "A bare `except:` also catches `KeyboardInterrupt` and `SystemExit`, so the program cannot be stopped."
externalRefs = ["https://peps.python.org/pep-0008/#programming-recommendations"]
limitations = ["A bare `except:` that re-raises is reported too."]

[[knowledge]]
id = "know-no-mutable-default-argument"
title = "Mutable default"
body = "The default is created once, when the function is defined, and shared by every call."
externalRefs = ["https://docs.python.org/3/faq/programming.html#why-are-default-values-shared-between-objects"]
limitations = ["A default that is never mutated is reported too."]

[[knowledge]]
id = "know-no-wildcard-import"
title = "Wildcard import"
body = "It hides where a name comes from and lets a module change what the file defines."
externalRefs = ["https://peps.python.org/pep-0008/#imports"]
limitations = ["A package `__init__` that re-exports is reported too."]

[[knowledge]]
id = "know-no-flask-debug"
title = "Debug mode in production"
body = "The Werkzeug debugger runs arbitrary code from the browser."
externalRefs = ["https://flask.palletsprojects.com/en/stable/debugging/", "https://cwe.mitre.org/data/definitions/489.html"]
limitations = ["A development entry point is reported too."]

[[knowledge]]
id = "know-no-http-without-timeout"
title = "Request without a timeout"
body = "Without a timeout a stalled server blocks the thread forever."
externalRefs = ["https://requests.readthedocs.io/en/latest/user/advanced/#timeouts", "https://cwe.mitre.org/data/definitions/400.html"]
limitations = ["A session configured with a default timeout is reported too; the keyword is looked for in the call's arguments."]

[[rules]]
id = "no-raw-markup"
packId = "debuggatha/python"
statement = "Do not mark text as safe markup with `mark_safe` or `Markup`; let the template escape it."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-raw-markup"]
appliesTo = { kind = "requires-language", language = "python" }

[[knowledge]]
id = "know-no-raw-markup"
title = "Raw markup skips escaping"
body = "`mark_safe` and `Markup` turn off escaping, so a value from a user becomes script injection."
externalRefs = ["https://cwe.mitre.org/data/definitions/79.html", "https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.safestring.mark_safe"]
limitations = ["Markup built only from constants is reported too."]
