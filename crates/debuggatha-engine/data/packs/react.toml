id = "debuggatha/react"
version = "1.0.0"
kind = "stack"
displayName = "React"
dependsOn = []

[[rules]]
id = "rules-of-hooks"
packId = "debuggatha/react"
statement = "Never call Hooks inside loops, conditions, or nested functions. Always use Hooks at the top level of a React functional component."
category = "architecture"
defaultSeverity = "critical"
knowledgeRefs = ["know-react-hooks"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[rules]]
id = "exhaustive-deps"
packId = "debuggatha/react"
statement = "Always include all variables from the component scope used inside `useEffect`, `useCallback`, or `useMemo` in the dependency array."
category = "architecture"
defaultSeverity = "high"
knowledgeRefs = ["know-react-deps"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[rules]]
id = "no-array-index-key"
packId = "debuggatha/react"
statement = "Avoid using the array index as the `key` prop in mapped elements unless the list is completely static and never reordered."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-react-keys"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[rules]]
id = "no-dangerously-set-inner-html"
packId = "debuggatha/react"
statement = "Avoid `dangerouslySetInnerHTML`. If necessary, ensure the input string is heavily sanitized (e.g., using DOMPurify) to prevent XSS."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-react-xss"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[rules]]
id = "state-colocation"
packId = "debuggatha/react"
statement = "Colocate state as close to where it is used as possible. Avoid pushing transient UI state to global stores (e.g., Redux, Context)."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-react-colocation"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[rules]]
id = "memoization-overhead"
packId = "debuggatha/react"
statement = "Do not blindly wrap every component in `React.memo` or every function in `useCallback`. Memoization carries an inherent comparison overhead."
category = "performance"
defaultSeverity = "low"
knowledgeRefs = ["know-react-memo"]
appliesTo = { kind = "requires-framework", framework = "react" }

[[knowledge]]
id = "know-react-hooks"
title = "Rules of Hooks"
body = "React relies on the call order of Hooks to match state and effects with the correct component instance. Conditional or looped hook calls scramble this order, causing catastrophic runtime bugs and state corruption."
externalRefs = ["https://legacy.reactjs.org/docs/hooks-rules.html"]
limitations = ["A custom Hook name that doesn't start with `use` (or a plain helper function that happens to call `useState` internally) can evade a naive lexical scan for hook calls inside conditionals, since the detector typically keys off the `use*` naming convention rather than true call-graph analysis."]

[[knowledge]]
id = "know-react-deps"
title = "Exhaustive Dependencies"
body = "Omitting a dependency from `useEffect` means the effect will 'see' a stale closure of that variable from a previous render. This leads to extremely difficult-to-debug logic errors."
externalRefs = ["https://github.com/facebook/react/tree/main/packages/eslint-plugin-react-hooks"]
limitations = ["A value intentionally omitted because it's a stable ref (`useRef`), a setter from `useState`, or already covered by a functional state updater (`setX(prev => ...)`) is a legitimate exception, not a bug — flagging every 'missing' dependency without recognizing these React-guaranteed-stable identities produces false positives."]

[[knowledge]]
id = "know-react-keys"
title = "Reconciliation and Keys"
body = "React uses the `key` prop to identify which items have changed, been added, or been removed. Using the array index as a key forces React to re-render all elements if the list is sorted or an item is deleted at the top."
externalRefs = ["https://react.dev/learn/rendering-lists#why-does-react-need-keys"]
limitations = ["Index-as-key is genuinely safe for a list that is provably static and never reordered/filtered/prepended (e.g. a fixed set of hardcoded nav links rendered once) — flagging every `.map((item, i) => <X key={i}>)` regardless of whether the underlying array ever mutates produces noise on legitimately static lists."]

[[knowledge]]
id = "know-react-xss"
title = "Cross-Site Scripting via DOM Injection"
body = "React is generally safe against XSS because it escapes strings in JSX. `dangerouslySetInnerHTML` bypasses this protection entirely. Injecting unsanitized user content here leads to arbitrary JavaScript execution."
externalRefs = ["https://react.dev/reference/react-dom/components/common#dangerouslysetinnerhtml"]
limitations = ["`dangerouslySetInnerHTML` fed exclusively by build-time/author-controlled content (e.g. compiled MDX output or a hardcoded marketing string with no user or CMS input in its provenance) carries no XSS risk despite matching the pattern — the danger is specifically about the data's trust boundary, not the API call itself."]

[[knowledge]]
id = "know-react-colocation"
title = "State Colocation"
body = "Global state triggers renders across vast swathes of the component tree. Pushing local UI state (like 'is a dropdown open') into a global store causes unnecessary cascading re-renders and couples isolated components."
externalRefs = ["https://kentcdodds.com/blog/state-colocation-will-make-your-react-app-faster"]
limitations = ["State that looks 'local' but is genuinely shared across distant, non-nested parts of the tree (e.g. a shopping cart count shown in both a header and a footer widget) legitimately belongs in a shared store — flagging any state usage in Context/Redux without checking whether multiple unrelated consumers actually need it produces a false positive."]

[[knowledge]]
id = "know-react-memo"
title = "Premature Memoization"
body = "React is highly optimized to re-render fast. `React.memo` requires a shallow equality check on props. If props change frequently, or if the component is very cheap to render, the memoization check itself becomes a performance bottleneck."
externalRefs = ["https://kentcdodds.com/blog/usememo-and-usecallback"]
limitations = ["Memoization is genuinely warranted for components that are expensive to render (large lists, heavy chart/canvas work) or that sit beneath a frequently-re-rendering parent with stable props — flagging every `React.memo`/`useCallback` usage as premature without weighing render cost and parent re-render frequency risks discouraging legitimate, measured optimizations."]
