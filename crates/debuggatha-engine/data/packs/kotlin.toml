id = "debuggatha/kotlin"
version = "1.0.0"
kind = "stack"
displayName = "Kotlin"
dependsOn = []

[[rules]]
id = "no-double-bang"
packId = "debuggatha/kotlin"
statement = "Never use the `!!` (not-null assertion) operator. Use safe calls `?.`, Elvis operator `?:`, or smart casts instead."
category = "architecture"
defaultSeverity = "critical"
knowledgeRefs = ["know-kotlin-null-safety"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "prefer-val-over-var"
packId = "debuggatha/kotlin"
statement = "Always use `val` for read-only variables unless mutation is strictly required."
category = "style"
defaultSeverity = "medium"
knowledgeRefs = ["know-kotlin-immutability"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "use-sealed-classes"
packId = "debuggatha/kotlin"
statement = "Use `sealed class` or `sealed interface` for representing restricted class hierarchies instead of open classes or basic enums when state is involved."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-kotlin-sealed"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "exhaustive-when"
packId = "debuggatha/kotlin"
statement = "Ensure `when` expressions on sealed classes or enums are exhaustive. Do not use generic `else` branches if all known cases can be mapped."
category = "architecture"
defaultSeverity = "high"
knowledgeRefs = ["know-kotlin-exhaustive-when"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "avoid-companion-object-state"
packId = "debuggatha/kotlin"
statement = "Do not store mutable state in `companion object` blocks. They are singletons and will cause race conditions in multithreaded environments."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-kotlin-companion"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "inline-functions-for-lambdas"
packId = "debuggatha/kotlin"
statement = "Use the `inline` modifier for higher-order functions that take lambdas to prevent runtime allocation overhead of function objects."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-kotlin-inline"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "suspend-function-cancellation"
packId = "debuggatha/kotlin"
statement = "Ensure long-running loops in `suspend` functions periodically check for cancellation (e.g., `yield()` or `isActive`)."
category = "performance"
defaultSeverity = "high"
knowledgeRefs = ["know-kotlin-coroutines"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[knowledge]]
id = "know-kotlin-null-safety"
title = "Subverting Null Safety"
body = "The `!!` operator forcefully converts any value to a non-null type. If the value is null, it instantly throws a `NullPointerException`. This completely circumvents Kotlin's primary safety feature."
externalRefs = ["https://kotlinlang.org/docs/null-safety.html#the-operator"]
limitations = ["In a unit test asserting that a value is non-null before further assertions run, `!!` is an accepted idiom (a null there should fail loudly, immediately) — flagging every `!!` occurrence identically whether in production request-handling code or in test setup treats a deliberate fail-fast assertion the same as a production null-safety violation."]

[[knowledge]]
id = "know-kotlin-immutability"
title = "Immutable by Default"
body = "Favoring `val` over `var` makes code easier to reason about, safer in concurrent contexts, and reduces the scope for state-related bugs."
externalRefs = ["https://kotlinlang.org/docs/coding-conventions.html#immutability"]
limitations = ["A loop accumulator, builder-pattern intermediate variable, or a field genuinely reassigned across a state machine's transitions needs `var` by design — flagging every `var` declaration without checking whether reassignment is actually algorithmically necessary produces false positives on legitimately mutable state."]

[[knowledge]]
id = "know-kotlin-sealed"
title = "Sealed Classes vs Enums"
body = "Enums allow a restricted set of instances, but they cannot hold different state per instance. Sealed classes allow subclasses to have multiple instances, each with their own state, making them ideal for representing algebraic data types like `Result<T>`."
externalRefs = ["https://kotlinlang.org/docs/sealed-classes.html"]
limitations = ["A truly fixed, stateless set of named constants (e.g. `enum class Direction { NORTH, SOUTH, EAST, WEST }`) has no per-instance state to represent, so an `enum` is the correct, idiomatic choice there — flagging every enum as a candidate for conversion to a sealed class ignores that sealed classes solve a problem (per-variant state) the enum doesn't have."]

[[knowledge]]
id = "know-kotlin-exhaustive-when"
title = "Exhaustive Pattern Matching"
body = "When you use an `else` branch on a sealed class hierarchy, the compiler stops warning you when new subclasses are added. Removing the `else` branch forces compile-time checking of all cases."
externalRefs = ["https://kotlinlang.org/docs/control-flow.html#when-expression"]
limitations = ["A `when` over a sealed hierarchy defined in a third-party library the codebase doesn't control (where new subclasses could be added by an upstream release without warning) may legitimately need a defensive `else` branch to avoid a runtime `NoWhenBranchMatchedException` on an unrecognized future subtype — flagging `else` as always avoidable ignores hierarchies not owned by the reviewed codebase."]

[[knowledge]]
id = "know-kotlin-companion"
title = "Singleton Mutation"
body = "Companion objects are initialized statically. Storing `var` properties inside them creates global mutable state, leading to cross-contamination between tests and threading issues in production."
externalRefs = ["https://kotlinlang.org/docs/object-declarations.html#companion-objects"]
limitations = ["A companion object `var` guarded by proper synchronization (e.g. `@Volatile` plus double-checked locking for a lazy singleton, or an `AtomicReference`) is a correctly-implemented thread-safe pattern, not the race-condition case this rule targets — flagging every mutable companion property regardless of synchronization produces false positives on deliberately hardened singleton code."]

[[knowledge]]
id = "know-kotlin-inline"
title = "Inline Functions"
body = "By default, lambdas in Kotlin compile to anonymous inner classes. Calling a lambda allocates an object. `inline` tells the compiler to paste the function's bytecode directly at the call site, eliminating the allocation."
externalRefs = ["https://kotlinlang.org/docs/inline-functions.html"]
limitations = ["A large, rarely-called higher-order function marked `inline` bloats bytecode at every call site (code-size/JIT-cacheability tradeoff) without a meaningful runtime win, and `inline` is disallowed entirely on public API functions that need binary stability across module boundaries — flagging every non-inlined lambda-accepting function as a missed optimization ignores these cases where inlining is actively undesirable or impossible."]

[[knowledge]]
id = "know-kotlin-coroutines"
title = "Cooperative Cancellation"
body = "Kotlin Coroutines are cooperatively cancelled. If a `suspend` function contains a tight loop (e.g., reading a file or processing a large collection) and never calls a suspending function like `yield()` or checks `isActive`, it cannot be cancelled by the parent scope."
externalRefs = ["https://kotlinlang.org/docs/cancellation-and-timeouts.html#cancellation-is-cooperative"]
limitations = ["A loop that already calls a genuinely suspending function on every iteration (e.g. an actual network or database call per item) has an implicit cancellation checkpoint at that suspension point already — flagging the absence of an explicit `yield()`/`isActive` check without recognizing an existing suspension point inside the loop produces a false positive."]

[[rules]]
id = "no-global-scope"
packId = "debuggatha/kotlin"
statement = "Do not launch coroutines in `GlobalScope`; use a scope tied to a lifecycle."
category = "architecture"
defaultSeverity = "high"
knowledgeRefs = ["know-no-global-scope"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "no-run-blocking"
packId = "debuggatha/kotlin"
statement = "Do not call `runBlocking` outside `main` and tests."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-run-blocking"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[knowledge]]
id = "know-no-global-scope"
title = "GlobalScope"
body = "A coroutine in `GlobalScope` lives until it finishes, whatever started it, and leaks."
externalRefs = ["https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/-global-scope/"]
limitations = ["A process-wide background job is reported."]

[[knowledge]]
id = "know-no-run-blocking"
title = "runBlocking"
body = "It blocks the calling thread until the coroutine ends and can deadlock a dispatcher."
externalRefs = ["https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/run-blocking.html"]
limitations = ["A bridge from blocking code that cannot be changed is reported."]

[[rules]]
id = "no-gc-collect"
packId = "debuggatha/kotlin"
statement = "Do not call `System.gc()`; let the JVM schedule collections."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-gc-collect"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[knowledge]]
id = "know-no-gc-collect"
title = "Forced collection"
body = "`System.gc()` is a hint that usually slows the program and hides a retention problem."
externalRefs = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/System.html#gc()"]
limitations = ["A benchmark or a memory test calls it on purpose."]

[[rules]]
id = "no-print-stack-trace"
packId = "debuggatha/kotlin"
statement = "Log exceptions with the project logger instead of printing their stack trace."
category = "style"
defaultSeverity = "low"
knowledgeRefs = ["know-no-print-stack-trace"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "no-shell-interpolation"
packId = "debuggatha/kotlin"
statement = "Do not build a shell command from interpolated or concatenated text; pass the arguments separately."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-no-shell-interpolation"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "no-unsafe-deserialization"
packId = "debuggatha/kotlin"
statement = "Do not deserialize data that can come from outside with a format that rebuilds arbitrary objects."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-unsafe-deserialization"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[rules]]
id = "no-weak-hash"
packId = "debuggatha/kotlin"
statement = "Do not use MD5, SHA-1 or DES for anything a person could attack; use SHA-256 or stronger."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-weak-hash"]
appliesTo = { kind = "requires-language", language = "kotlin" }

[[knowledge]]
id = "know-no-print-stack-trace"
title = "Stack trace printed to the console"
body = "A trace printed to the console skips the logger, so it carries no level or context and can reach a user. Pass the exception to the logger."
externalRefs = ["https://cwe.mitre.org/data/definitions/209.html", "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"]
limitations = ["A command-line tool that prints its error for the person running it is reported although that is its job."]

[[knowledge]]
id = "know-no-shell-interpolation"
title = "Shell command built from text"
body = "A command line assembled by interpolation or concatenation is read by a shell, so a value with a quote or a separator becomes a second command. Pass the program and its arguments as separate values."
externalRefs = ["https://cwe.mitre.org/data/definitions/78.html"]
limitations = ["Only a command built in the same file and reached by name is seen; a command assembled in another function or module is not, and a variable that only ever holds constants is reported."]

[[knowledge]]
id = "know-no-unsafe-deserialization"
title = "Deserializing untrusted bytes"
body = "Formats that rebuild arbitrary objects can run code while loading. Read data-only formats such as JSON, or restrict the classes that may be rebuilt."
externalRefs = ["https://cwe.mitre.org/data/definitions/502.html", "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"]
limitations = ["The rule cannot tell whether the bytes come from a trusted place, so data the program wrote itself is reported too.", "A call with a second argument (for example a class allowlist) is left alone; whether that argument is enough is not checked."]

[[knowledge]]
id = "know-no-weak-hash"
title = "Broken hash or cipher"
body = "MD5, SHA-1 and DES have practical collision or brute-force attacks. Use SHA-256 or stronger, and a password hash for passwords."
externalRefs = ["https://cwe.mitre.org/data/definitions/327.html"]
limitations = ["The use of the hash is not visible: checksums and cache keys are reported with low confidence.", "A digest chosen by name at run time, such as getInstance(\"MD5\"), is not read."]
