id = "debuggatha/express"
version = "1.0.0"
kind = "stack"
displayName = "Express"
dependsOn = []

[[rules]]
id = "async-route-errors"
packId = "debuggatha/express"
statement = "Always wrap async route handlers in a `try/catch` and pass errors to `next(err)`, or use an async error wrapper (like `express-async-errors`)."
category = "architecture"
defaultSeverity = "critical"
knowledgeRefs = ["know-express-async-errors"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "always-return-responses"
packId = "debuggatha/express"
statement = "Always prefix response calls with `return` (e.g., `return res.status(200).send()`) to prevent execution of subsequent code after sending the response."
category = "architecture"
defaultSeverity = "high"
knowledgeRefs = ["know-express-double-send"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "disable-x-powered-by"
packId = "debuggatha/express"
statement = "Disable the `X-Powered-By` header using `app.disable('x-powered-by')` or helmet."
category = "security"
defaultSeverity = "low"
knowledgeRefs = ["know-express-x-powered-by"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "use-helmet"
packId = "debuggatha/express"
statement = "Use the `helmet` middleware to set secure HTTP headers (CSP, HSTS, Frameguard, etc)."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-express-helmet"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "validate-input"
packId = "debuggatha/express"
statement = "Never trust `req.body` or `req.query`. Always validate and sanitize input against a strict schema (e.g., Zod or Joi) before processing."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-express-validation"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "no-open-cors"
packId = "debuggatha/express"
statement = "Do not enable CORS for every origin: restrict `origin` to an explicit allow-list instead of calling `cors()` with no options or setting `origin: \"*\"`."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-express-open-cors"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[rules]]
id = "no-error-leak"
packId = "debuggatha/express"
statement = "Do not send `err.stack` or the raw error message to the client. Log the error server-side and respond with a generic message."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-express-error-leak"]
appliesTo = { kind = "requires-framework", framework = "express" }

[[knowledge]]
id = "know-express-async-errors"
title = "Unhandled Promise Rejections in Express"
body = "Express v4 does not catch unhandled promise rejections in async route handlers. If an async route throws, the request hangs until timeout, and the server process may crash depending on the Node version."
externalRefs = ["https://expressjs.com/en/guide/error-handling.html"]
limitations = ["Express 5 (released as stable in 2024) natively catches rejected promises returned from async handlers and forwards them to the error-handling middleware automatically — this rule's premise (v4's lack of built-in handling) is a false positive when applied to an Express 5 codebase that doesn't need `express-async-errors` or manual try/catch at all."]

[[knowledge]]
id = "know-express-double-send"
title = "ERR_HTTP_HEADERS_SENT"
body = "Calling `res.send()` does not stop function execution. If code continues and calls `res.send()` again, the Node runtime will crash with `ERR_HTTP_HEADERS_SENT`. Using `return res.send()` prevents this."
externalRefs = ["https://nodejs.org/api/http.html#responsewriteheadstatuscode-statusmessage-headers"]
limitations = ["A response call that is genuinely the last statement in its function body (nothing executes after it, so a missing `return` has no double-send risk) is safe despite lacking the `return` keyword — a rule requiring `return` on every response call, rather than only ones followed by further executable code in the same path, will false-positive on this common case."]

[[knowledge]]
id = "know-express-x-powered-by"
title = "Information Leakage"
body = "The `X-Powered-By` header broadcasts the technology stack to potential attackers, aiding in targeted vulnerability scanning."
externalRefs = ["https://expressjs.com/en/advanced/best-practice-security.html#disable-x-powered-by-header"]
limitations = ["Removing the `X-Powered-By` header alone doesn't hide the stack from a determined attacker — response timing, error page shape, or other headers (e.g. a framework-specific cookie name) can still fingerprint Express, so this is defense-in-depth, not a rule whose absence implies the stack is actually undiscoverable."]

[[knowledge]]
id = "know-express-helmet"
title = "Secure HTTP Headers"
body = "Out of the box, Express misses critical security headers. Helmet configures Content Security Policy, prevents Clickjacking (X-Frame-Options), and enforces Strict-Transport-Security (HSTS)."
externalRefs = ["https://expressjs.com/en/advanced/best-practice-security.html#use-helmet"]
limitations = ["An app that sets the equivalent headers manually (its own CSP/HSTS/X-Frame-Options middleware) or sits behind a reverse proxy/CDN (e.g. Cloudflare, an API gateway) that already injects these headers doesn't need `helmet` itself — flagging the absence of the `helmet` package specifically, rather than the absence of the headers it would set, produces a false positive."]

[[knowledge]]
id = "know-express-validation"
title = "Input Validation"
body = "Assuming the structure of `req.body` leads to Prototype Pollution, NoSQL injection (in MongoDB), and type confusion crashes. Strict schema validation is a mandatory boundary."
externalRefs = ["https://zod.dev/", "https://joi.dev/"]
limitations = ["Validation performed inside a shared middleware applied via `router.use()` upstream of the handler (rather than inline in the handler itself) satisfies this rule even though the handler's own code shows no visible validation call — a rule that only inspects the handler function body in isolation, without tracing the middleware chain, produces a false positive by missing that upstream validation."]

[[knowledge]]
id = "know-express-open-cors"
title = "Open CORS Policy"
body = "The `cors` middleware with no options allows every origin. Combined with cookies or tokens that the browser attaches automatically, any website can then call the API as the signed-in user. An explicit origin allow-list limits that."
externalRefs = ["https://expressjs.com/en/resources/middleware/cors.html", "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"]
limitations = ["A public, read-only API that serves no credentialed or per-user data is meant to be open to every origin; the rule cannot tell whether the endpoints behind the middleware are public."]

[[knowledge]]
id = "know-express-error-leak"
title = "Error Details in Responses"
body = "Stack traces and raw error messages reveal file paths, library versions, and query text to whoever triggers the error. Log the detail on the server and return a generic message with an error id."
externalRefs = ["https://expressjs.com/en/guide/error-handling.html", "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"]
limitations = ["Development-only error handlers, or messages from errors the code itself created for the client (such as validation errors), are meant to be shown; the detector cannot tell whether the error is one of those."]
