id = "debuggatha/csharp"
version = "1.0.0"
kind = "stack"
displayName = "C#"
dependsOn = []

[[rules]]
id = "no-unsafe-deserialization"
packId = "debuggatha/csharp"
statement = "Do not deserialize data that can come from outside with a format that rebuilds arbitrary objects."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-unsafe-deserialization"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[rules]]
id = "no-weak-hash"
packId = "debuggatha/csharp"
statement = "Do not use MD5, SHA-1 or DES for anything a person could attack; use SHA-256 or stronger."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-weak-hash"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[knowledge]]
id = "know-no-unsafe-deserialization"
title = "Deserializing untrusted bytes"
body = "Formats that rebuild arbitrary objects can run code while loading. Read data-only formats such as JSON, or restrict the classes that may be rebuilt."
externalRefs = ["https://cwe.mitre.org/data/definitions/502.html", "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"]
limitations = ["The rule cannot tell whether the bytes come from a trusted place, so data the program wrote itself is reported too.", "A call with a second argument (for example a class allowlist) is left alone; whether that argument is enough is not checked."]

[[knowledge]]
id = "know-no-weak-hash"
title = "Broken hash or cipher"
body = "MD5, SHA-1 and DES have practical collision or brute-force attacks. Use SHA-256 or stronger, and a password hash for passwords."
externalRefs = ["https://cwe.mitre.org/data/definitions/327.html"]
limitations = ["The use of the hash is not visible: checksums and cache keys are reported with low confidence.", "A digest chosen by name at run time, such as getInstance(\"MD5\"), is not read."]

[[rules]]
id = "no-async-void"
packId = "debuggatha/csharp"
statement = "Do not write `async void` methods other than event handlers; return `Task`."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-async-void"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[rules]]
id = "no-lock-this"
packId = "debuggatha/csharp"
statement = "Do not `lock (this)`; lock a private object."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-lock-this"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[rules]]
id = "no-gc-collect"
packId = "debuggatha/csharp"
statement = "Do not call `GC.Collect()`; let the runtime schedule collections."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-gc-collect"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[knowledge]]
id = "know-no-async-void"
title = "Async void"
body = "An exception in an `async void` method cannot be caught by the caller and ends the process."
externalRefs = ["https://learn.microsoft.com/en-us/archive/msdn-magazine/2013/march/async-await-best-practices-in-asynchronous-programming"]
limitations = ["Event handlers must be `async void` and are reported (low)."]

[[knowledge]]
id = "know-no-lock-this"
title = "Locking on this"
body = "Any code with a reference to the object can take the same lock and deadlock the class."
externalRefs = ["https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca2002"]
limitations = ["A sealed internal type nobody else locks is reported too."]

[[knowledge]]
id = "know-no-gc-collect"
title = "Forced collection"
body = "Forcing a collection usually slows the program and hides a retention problem."
externalRefs = ["https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/induced"]
limitations = ["A benchmark or a memory test calls it on purpose."]

[[rules]]
id = "no-shell-interpolation"
packId = "debuggatha/csharp"
statement = "Do not build a shell command from interpolated or concatenated text; pass the arguments separately."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-no-shell-interpolation"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[knowledge]]
id = "know-no-shell-interpolation"
title = "Shell command built from text"
body = "A command line assembled by interpolation or concatenation is read by a shell, so a value with a quote or a separator becomes a second command. Pass the program and its arguments as separate values."
externalRefs = ["https://cwe.mitre.org/data/definitions/78.html"]
limitations = ["Only a command built in the same file and reached by name is seen; a command assembled in another function or module is not, and a variable that only ever holds constants is reported."]

[[rules]]
id = "async-all-the-way"
packId = "debuggatha/csharp"
statement = "Never call `.Wait()` or `.Result` on a Task. Always use `await` all the way up the call stack to prevent thread pool starvation."
category = "performance"
defaultSeverity = "critical"
knowledgeRefs = ["know-aspnetcore-async"]
appliesTo = { kind = "requires-language", language = "csharp" }

[[knowledge]]
id = "know-aspnetcore-async"
title = "Deadlocks and Thread Pool Starvation"
body = "Blocking on async code by calling `.Result` ties up a thread pool thread while waiting for a background thread to finish. Under load, this rapidly exhausts the ASP.NET thread pool, hanging the entire application."
externalRefs = ["https://learn.microsoft.com/en-us/aspnet/core/performance/performance-best-practices#avoid-blocking-calls"]
limitations = ["`.Result`/`.Wait()` inside a console app's `Main` or a one-shot startup/bootstrapping path (no `SynchronizationContext` to deadlock against, and no thread-pool contention concern) is not the thread-pool-starvation hazard this rule targets — the risk is specific to ASP.NET Core request-handling code under load, not blocking calls in general.", "Without types, any `.Wait()` is reported (a process or an event wait handle too)."]
