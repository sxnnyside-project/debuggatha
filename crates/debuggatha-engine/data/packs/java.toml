id = "debuggatha/java"
version = "1.0.0"
kind = "stack"
displayName = "Java"
dependsOn = []

[[rules]]
id = "no-shell-interpolation"
packId = "debuggatha/java"
statement = "Do not build a shell command from interpolated or concatenated text; pass the arguments separately."
category = "security"
defaultSeverity = "critical"
knowledgeRefs = ["know-no-shell-interpolation"]
appliesTo = { kind = "requires-language", language = "java" }

[[rules]]
id = "no-unsafe-deserialization"
packId = "debuggatha/java"
statement = "Do not deserialize data that can come from outside with a format that rebuilds arbitrary objects."
category = "security"
defaultSeverity = "high"
knowledgeRefs = ["know-no-unsafe-deserialization"]
appliesTo = { kind = "requires-language", language = "java" }

[[rules]]
id = "no-weak-hash"
packId = "debuggatha/java"
statement = "Do not use MD5, SHA-1 or DES for anything a person could attack; use SHA-256 or stronger."
category = "security"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-weak-hash"]
appliesTo = { kind = "requires-language", language = "java" }

[[rules]]
id = "no-print-stack-trace"
packId = "debuggatha/java"
statement = "Log exceptions with the project logger instead of printing their stack trace."
category = "style"
defaultSeverity = "low"
knowledgeRefs = ["know-no-print-stack-trace"]
appliesTo = { kind = "requires-language", language = "java" }

[[knowledge]]
id = "know-no-shell-interpolation"
title = "Shell command built from text"
body = "A command line assembled by interpolation or concatenation is read by a shell, so a value with a quote or a separator becomes a second command. Pass the program and its arguments as separate values."
externalRefs = ["https://cwe.mitre.org/data/definitions/78.html"]
limitations = ["Only a command built in the same file and reached by name is seen; a command assembled in another function or module is not, and a variable that only ever holds constants is reported."]

[[knowledge]]
id = "know-no-unsafe-deserialization"
title = "Deserializing untrusted bytes"
body = "Formats that rebuild arbitrary objects can run code while loading. Read data-only formats such as JSON, or restrict the classes that may be rebuilt."
externalRefs = ["https://cwe.mitre.org/data/definitions/502.html", "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"]
limitations = ["The rule cannot tell whether the bytes come from a trusted place, so data the program wrote itself is reported too.", "A call with a second argument (for example a class allowlist) is left alone; whether that argument is enough is not checked."]

[[knowledge]]
id = "know-no-weak-hash"
title = "Broken hash or cipher"
body = "MD5, SHA-1 and DES have practical collision or brute-force attacks. Use SHA-256 or stronger, and a password hash for passwords."
externalRefs = ["https://cwe.mitre.org/data/definitions/327.html"]
limitations = ["The use of the hash is not visible: checksums and cache keys are reported with low confidence.", "A digest chosen by name at run time, such as getInstance(\"MD5\"), is not read."]

[[knowledge]]
id = "know-no-print-stack-trace"
title = "Stack trace printed to the console"
body = "A trace printed to the console skips the logger, so it carries no level or context and can reach a user. Pass the exception to the logger."
externalRefs = ["https://cwe.mitre.org/data/definitions/209.html", "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"]
limitations = ["A command-line tool that prints its error for the person running it is reported although that is its job."]

[[rules]]
id = "no-wildcard-import"
packId = "debuggatha/java"
statement = "Do not use `import pkg.*`; import the classes you use."
category = "style"
defaultSeverity = "low"
knowledgeRefs = ["know-no-wildcard-import"]
appliesTo = { kind = "requires-language", language = "java" }

[[rules]]
id = "no-finalize"
packId = "debuggatha/java"
statement = "Do not override `finalize()`; use try-with-resources or a `Cleaner`."
category = "architecture"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-finalize"]
appliesTo = { kind = "requires-language", language = "java" }

[[knowledge]]
id = "know-no-wildcard-import"
title = "Wildcard import"
body = "It hides where a class comes from and a new class in the package can change what the file means."
externalRefs = ["https://google.github.io/styleguide/javaguide.html#s3.3.1-wildcard-imports"]
limitations = ["Static imports of constants in test code are reported too."]

[[knowledge]]
id = "know-no-finalize"
title = "Finalizers"
body = "Finalization is deprecated for removal: it runs at an unpredictable time, may never run, and slows the collector."
externalRefs = ["https://openjdk.org/jeps/421"]
limitations = ["A class that must support old runtimes is reported."]

[[rules]]
id = "no-gc-collect"
packId = "debuggatha/java"
statement = "Do not call `System.gc()`; let the JVM schedule collections."
category = "performance"
defaultSeverity = "medium"
knowledgeRefs = ["know-no-gc-collect"]
appliesTo = { kind = "requires-language", language = "java" }

[[knowledge]]
id = "know-no-gc-collect"
title = "Forced collection"
body = "`System.gc()` is a hint that usually slows the program and hides a retention problem."
externalRefs = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/System.html#gc()"]
limitations = ["A benchmark or a memory test calls it on purpose."]
