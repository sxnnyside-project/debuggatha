name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/vscode/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/vscode/.node-version
          cache: pnpm
          cache-dependency-path: apps/vscode/pnpm-lock.yaml
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just check
      - run: just smoke
      - uses: actions/cache@v4
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-1.90.2
      - run: xvfb-run -a just test-vscode
      # The current stable release too: the manifest promises the oldest, users run the newest.
      - run: xvfb-run -a just test-vscode-stable
