name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Validate Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate commit messages in PR range
        run: |
          chmod +x scripts/check-commit-range.sh
          scripts/check-commit-range.sh origin/${{ github.base_ref }}..HEAD

  check:
    name: Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/vscode/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/vscode/.node-version
          cache: pnpm
          cache-dependency-path: apps/vscode/pnpm-lock.yaml

      - name: Setup just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.39.0,cargo-deny@0.19.9

      - name: Install dependencies
        run: just install parity-install

      - name: Quality gate
        run: just check

      - name: Smoke test packages
        run: just smoke

      - name: Cache VS Code test installations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-1.90.2

      - name: Run VS Code extension integration tests (minimum supported version)
        run: xvfb-run -a just test-vscode

      - name: Run VS Code extension integration tests (stable version)
        run: xvfb-run -a just test-vscode-stable

  rust-targets:
    name: Rust binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-2025 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the release binary (toolchain pinned by rust-toolchain.toml)
        run: cargo build --release --locked -p debuggatha-cli

      - name: Run it
        shell: bash
        run: |
          out="$(target/release/debuggatha --version)"
          echo "$out"
          test "$out" = "debuggatha $(cargo pkgid -p debuggatha-cli | sed 's/.*[#@]//')"

  rust-publish-dry-run:
    name: Rust publish dry run (nothing is published)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package and verify every crate in publish order
        run: cargo publish --workspace --dry-run --locked
