name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./apps/vscode/package.json').version")
          TAG_VERSION=${{ steps.version.outputs.VERSION }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Package extension
        working-directory: apps/vscode
        run: vsce package --no-dependencies -o debuggatha-${{ steps.version.outputs.VERSION }}.vsix

      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode
        run: vsce publish --no-dependencies --packagePath debuggatha-${{ steps.version.outputs.VERSION }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        working-directory: apps/vscode
        run: ovsx publish debuggatha-${{ steps.version.outputs.VERSION }}.vsix -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/vscode/debuggatha-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true
          body: |
            ## Debuggatha v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/sxnnyside-project/debuggatha/blob/main/CHANGELOG.md) for details.

            ### Install
            Search **Debuggatha** in the VS Code Extensions panel, or download the `.vsix` from this release and install manually:

            ```
            code --install-extension debuggatha-${{ steps.version.outputs.VERSION }}.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
