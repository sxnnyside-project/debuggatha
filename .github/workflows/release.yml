name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every manifest carries the tagged version
        run: scripts/verify-version.sh "${TAG#v}"

      - name: The tagged commit is on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  gate:
    name: Quality gate
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, platform: darwin-arm64, runner: macos-15 }
          - { target: x86_64-unknown-linux-gnu, platform: linux-x64, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, platform: win32-x64, runner: windows-2025 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.39.0

      - name: Build the release binary (toolchain pinned by rust-toolchain.toml)
        run: cargo build --release --locked --target ${{ matrix.target }} -p debuggatha-cli

      - name: Archive it
        shell: bash
        run: VERSION="${TAG#v}" just package
        env:
          TARGET: ${{ matrix.target }}

      - name: Keep the archive and the binary for the publish job
        shell: bash
        run: |
          mkdir -p handoff
          cp dist/*.tar.gz dist/*.zip handoff/ 2>/dev/null || true
          exe=debuggatha; [ "${{ matrix.platform }}" = "win32-x64" ] && exe=debuggatha.exe
          cp "target/${{ matrix.target }}/release/$exe" "handoff/binary-${{ matrix.platform }}-$exe"

      - name: Upload for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: handoff/*
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: handoff
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/vscode/package.json

      - name: Setup just and git-cliff
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.39.0,git-cliff@2.10.1

      - name: Release notes from the Conventional Commits since the previous tag
        run: VERSION="${TAG#v}" just changelog

      - name: Checksums of every asset
        run: |
          mkdir -p assets
          cp handoff/*.tar.gz handoff/*.zip assets/
          (cd assets && sha256sum * > SHA256SUMS)

      # npm: platform packages first, then the launcher that depends on them, then the MCP launcher.
      - name: Publish to npm
        run: |
          npm install -g npm@11
          version="${TAG#v}"
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            exe=debuggatha; [ "$platform" = "win32-x64" ] && exe=debuggatha.exe
            dir=$(scripts/package-npm.sh "$platform" "handoff/binary-$platform-$exe" "$version" dist/npm)
            scripts/publish-npm.sh "$dir"
          done
          scripts/publish-npm.sh npm/cli
          scripts/publish-npm.sh npm/mcp

      - name: Publish the crates in dependency order
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Package the extension
        run: |
          just vscode-install
          just vscode-package
          mv apps/vscode/*.vsix "assets/debuggatha-${TAG#v}.vsix"
          (cd assets && sha256sum * > SHA256SUMS)

      - name: Publish to the VS Code Marketplace
        working-directory: apps/vscode
        run: pnpm exec vsce publish --skip-duplicate --no-dependencies --packagePath "../../assets/debuggatha-${TAG#v}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: apps/vscode
        run: pnpm exec ovsx publish "../../assets/debuggatha-${TAG#v}.vsix" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create the GitHub release, once
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
