name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'cli-v*.*.*'
      - 'mcp-v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  extension:
    name: Publish VS Code Extension
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/vscode/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/vscode/.node-version
          cache: pnpm
          cache-dependency-path: apps/vscode/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Quality gate
        run: just check

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./apps/vscode/package.json').version")
          TAG_VERSION=${{ steps.version.outputs.VERSION }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Package extension
        working-directory: apps/vscode
        run: pnpm exec vsce package --no-dependencies -o debuggatha-${{ steps.version.outputs.VERSION }}.vsix

      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode
        run: pnpm exec vsce publish --no-dependencies --packagePath debuggatha-${{ steps.version.outputs.VERSION }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        working-directory: apps/vscode
        run: pnpm dlx ovsx publish debuggatha-${{ steps.version.outputs.VERSION }}.vsix -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/vscode/debuggatha-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true
          body: |
            ## Debuggatha v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/sxnnyside-project/debuggatha/blob/main/CHANGELOG.md) for details.

            ### Install
            Search **Debuggatha** in the VS Code Extensions panel, or download the `.vsix` from this release and install manually:

            ```
            code --install-extension debuggatha-${{ steps.version.outputs.VERSION }}.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    name: Publish CLI
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#cli-v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Build, test, and smoke-test the installed package
        run: |
          just test
          just smoke

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build standalone binaries
        run: just binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/binaries/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp:
    name: Publish MCP server
    if: startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#mcp-v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Build, test, and smoke-test the installed package
        run: |
          just test
          just smoke

      - name: Publish to npm
        working-directory: packages/mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
